<nav class="app-navbar">
  <a class="brand me-auto" routerLink="/employees">EMP.DB</a>

  <div class="d-flex align-items-center gap-2">
    @if (!auth.isLoggedIn()) {
      <a class="btn-nav" routerLink="/login">Log in</a>
      <a class="btn-nav solid" routerLink="/register">Sign up</a>
    } @else {
      <span class="nav-user d-none d-sm-inline">{{ auth.username() }}</span>
      @if (auth.isAdmin()) {
        <span class="badge-role admin">Admin</span>
      } @else {
        <span class="badge-role user">User</span>
      }
      <button class="btn-nav" (click)="logout()">Log out</button>
    }
  </div>
</nav>

<main class="container-fluid px-3 px-md-4 py-4">
  <router-outlet />
</main>
