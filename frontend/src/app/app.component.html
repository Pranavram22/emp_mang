<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" routerLink="/employees">Employee DB</a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      @if (!auth.isLoggedIn()) {
        <a class="btn btn-outline-light btn-sm" routerLink="/login">Login</a>
        <a class="btn btn-light btn-sm text-primary fw-semibold" routerLink="/register">Sign up</a>
      } @else {
        <span class="navbar-text text-white small opacity-75 d-none d-sm-inline">{{ auth.username() }}</span>
        @if (auth.isAdmin()) {
          <span class="badge rounded-pill text-bg-warning">Admin</span>
        } @else {
          <span class="badge rounded-pill text-bg-light text-secondary">User</span>
        }
        <button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
      }
    </div>
  </div>
</nav>
<main class="container-fluid px-4">
  <router-outlet />
</main>
